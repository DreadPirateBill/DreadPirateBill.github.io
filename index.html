<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprocket Player</title>
<meta name="theme-color" content="#07090d">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="alternate" hreflang="en" href="https://sprocketplayer.com/en/">
<link rel="alternate" hreflang="fr" href="https://sprocketplayer.com/fr/">
<link rel="alternate" hreflang="de" href="https://sprocketplayer.com/de/">
<link rel="alternate" hreflang="es" href="https://sprocketplayer.com/es/">
<link rel="alternate" hreflang="it" href="https://sprocketplayer.com/it/">
<link rel="alternate" hreflang="ja" href="https://sprocketplayer.com/ja/">
<link rel="alternate" hreflang="x-default" href="https://sprocketplayer.com/">
<script>
(function () {
  // Language redirector. Order of preference:
  //   1. a language the visitor picked from the switcher (saved in localStorage)
  //   2. the browser's language list, matched on the primary subtag
  //   3. English
  var langs = ["en", "fr", "de", "es", "it", "ja"];
  var page = "";
  var pick = null;
  try {
    var saved = localStorage.getItem("sp-lang");
    if (langs.indexOf(saved) >= 0) pick = saved;
  } catch (e) {}
  if (!pick) {
    var prefs = navigator.languages || [navigator.language || "en"];
    for (var i = 0; i < prefs.length && !pick; i++) {
      var primary = String(prefs[i]).toLowerCase().split("-")[0];
      if (langs.indexOf(primary) >= 0) pick = primary;
    }
  }
  location.replace("/" + (pick || "en") + "/" + page + location.search + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=/en/"></noscript>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07090d; color: #f3f5f8;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { text-align: center; padding: 2rem; }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; }
  ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem; justify-content: center; }
  a { color: #29c6ff; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>Sprocket Player</h1>
  <ul>
<li><a href="/en/" lang="en">English</a></li>
<li><a href="/fr/" lang="fr">Français</a></li>
<li><a href="/de/" lang="de">Deutsch</a></li>
<li><a href="/es/" lang="es">Español</a></li>
<li><a href="/it/" lang="it">Italiano</a></li>
<li><a href="/ja/" lang="ja">日本語</a></li>
  </ul>
</main>
</body>
</html>
